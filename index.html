<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Restrito</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="fundo-novo">
    <div class="container" style="max-width: 400px; margin-top: 10vh;">
        <header class="form-header">
            <img src="imagens/logopreto.png" alt="Logomarca" class="logo-empresa">
            <h1>Acesso ao Sistema</h1>
        </header>

        <form id="formLogin">
            <div class="form-group">
                <label for="usuario">Usuário:</label>
                <input type="text" id="usuario" style="width: 100%; box-sizing: border-box;" required>
            </div>
            
            <div class="form-group">
                <label for="senha">Senha:</label>
                <div style="position: relative; display: flex; align-items: center;">
                    <input type="password" id="senha" style="width: 100%; box-sizing: border-box; padding-right: 40px;" required>
                    <span id="btnOlho" onclick="mostrarSenha()" style="position: absolute; right: 10px; cursor: pointer; font-size: 18px; user-select: none;">👁️</span>
                </div>
            </div>

            <p id="msgErro" style="color: #dc2626; text-align: center; display: none; font-weight: bold;">Usuário ou senha incorretos.</p>
            <p id="msgCarregando" style="color: #2563eb; text-align: center; display: none;">Validando credenciais...</p>

            <button type="submit" id="btnEntrar" style="width: 100%; margin-top: 15px;">ENTRAR</button>
        </form>

        <script>
            // Nova função para mostrar/ocultar a senha
            function mostrarSenha() {
                const inputSenha = document.getElementById("senha");
                const btnOlho = document.getElementById("btnOlho");
                
                if (inputSenha.type === "password") {
                    inputSenha.type = "text";
                    btnOlho.innerText = "🙈"; // Troca pro macaquinho ou olho fechado
                } else {
                    inputSenha.type = "password";
                    btnOlho.innerText = "👁️";
                }
            }
        </script>
    </div>

    <script src="config.js"></script>
    <script>
        document.getElementById("formLogin").addEventListener("submit", function(e) {
            e.preventDefault();

            const usuario = document.getElementById("usuario").value.trim();
            const senha = document.getElementById("senha").value.trim();

            fetch(`${URL_GAS}?acao=login&usuario=${encodeURIComponent(usuario)}&senha=${encodeURIComponent(senha)}`)
                .then(res => res.json())
                .then(data => {
                    if (data.sucesso === true) {
                        localStorage.setItem("usuarioLogado", usuario);
                        localStorage.setItem("sessaoAtiva", "sim");

                        window.location.href = "portal.html";
                    } else {
                        alert("Usuário ou senha inválidos.");
                    }
                })
                .catch(err => {
                    alert("Erro de comunicação com o servidor: " + err);
                });
        });
    </script>
</body>
</html>
