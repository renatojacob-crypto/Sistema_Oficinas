<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Restrito</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="fundo-novo">
    <div class="container" style="max-width: 400px; margin-top: 10vh;">
        <header class="form-header">
            <img src="imagens/logopreto.png" alt="Logomarca" class="logo-empresa">
            <h1>Acesso ao Sistema</h1>
        </header>

        <form id="formLogin">
            <div class="form-group">
                <label for="usuario">Usuário:</label>
                <input type="text" id="usuario" style="width: 100%; box-sizing: border-box;" required>
            </div>
            
            <div class="form-group">
                <label for="senha">Senha:</label>
                <div style="position: relative; display: flex; align-items: center;">
                    <input type="password" id="senha" style="width: 100%; box-sizing: border-box; padding-right: 40px;" required>
                    <span id="btnOlho" onclick="mostrarSenha()" style="position: absolute; right: 10px; cursor: pointer; font-size: 18px; user-select: none;">👁️</span>
                </div>
            </div>

            <p id="msgErro" style="color: #dc2626; text-align: center; display: none; font-weight: bold;">Usuário ou senha incorretos.</p>
            <p id="msgCarregando" style="color: #2563eb; text-align: center; display: none;">Validando credenciais...</p>

            <button type="submit" id="btnEntrar" style="width: 100%; margin-top: 15px;">ENTRAR</button>
        </form>

        <script>
            // Nova função para mostrar/ocultar a senha
            function mostrarSenha() {
                const inputSenha = document.getElementById("senha");
                const btnOlho = document.getElementById("btnOlho");
                
                if (inputSenha.type === "password") {
                    inputSenha.type = "text";
                    btnOlho.innerText = "🙈"; // Troca pro macaquinho ou olho fechado
                } else {
                    inputSenha.type = "password";
                    btnOlho.innerText = "👁️";
                }
            }
        </script>
    </div>

    <script src="config.js"></script>
    <script>
        document.getElementById("formLogin").onsubmit = function(e) {
            e.preventDefault();
            
            const btn = document.getElementById("btnEntrar");
            const erro = document.getElementById("msgErro");
            const carregando = document.getElementById("msgCarregando");
            const u = document.getElementById("usuario").value;
            const s = document.getElementById("senha").value;

            btn.disabled = true;
            erro.style.display = "none";
            carregando.style.display = "block";

            // Envia os dados para a planilha verificar
            fetch(`${URL_GAS}?acao=login&usuario=${encodeURIComponent(u)}&senha=${encodeURIComponent(s)}`)
                .then(res => res.json())
                .then(data => {
                    if (data.sucesso) {
                        // Salva o "crachá" na sessão do navegador
                        sessionStorage.setItem("logado", "sim");
                        window.location.href = "portal.html"; // Redireciona
                    } else {
                        erro.style.display = "block";
                        btn.disabled = false;
                        carregando.style.display = "none";
                    }
                })
                .catch(err => {
                    alert("Erro ao conectar com o servidor.");
                    btn.disabled = false;
                    carregando.style.display = "none";
                });
        };
    </script>
</body>
</html>
