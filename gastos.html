<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lançamento de Gastos Realizados</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .box-financas { border: 1px solid #e5e7eb; border-radius: 8px; padding: 25px; margin-bottom: 20px; background: #ffffff; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;}
        @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } }
        .input-money { position: relative; }
        .input-money::before { content: "R$"; position: absolute; left: 10px; top: 38px; color: #6b7280; font-weight: 600; }
        .input-money input { padding-left: 35px !important; font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <header class="form-header" style="text-align: center;">
            <a href="siscontrol.html" style="text-decoration: none; color: var(--primary-color); font-size: 14px; font-weight: 600;">← Voltar ao Início</a>
            <h1>Lançamento de Gastos Realizados</h1>
        </header>

        <div id="status" style="text-align: center; padding: 20px;">A preparar ambiente...</div>

        <form id="formGastos" class="box-financas" style="display:none;">
            <div class="form-group">
                <label>Selecione a Oficina realizada:</label>
                <select id="agendamentoSelect" required>
                    <option value="">Carregando oficinas...</option>
                </select>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>Data Inicial do Gasto:</label>
                    <input type="date" id="dataInicial" required>
                </div>
                <div class="form-group">
                    <label>Data Final do Gasto:</label>
                    <input type="date" id="dataFinal" required>
                </div>
            </div>

            <div class="form-group input-money">
                <label>Valor Total Realizado:</label>
                <input type="number" id="valorTotal" step="0.01" placeholder="0,00" required>
            </div>

            <button type="submit" id="btnEnviar" class="btn-acao" style="width:100%; margin-top:20px;">Registrar Gasto Definitivo</button>
        </form>
    </div>

    <script src="auth.js"></script>
    <script>
        verificarLogin();
    </script>
    <script src="config.js"></script>
    <script>
        let agendamentosGlobais = [];

        window.onload = () => {
            fetch(URL_GAS)
                .then(res => res.json())
                .then(data => {
                    agendamentosGlobais = data.agendamentos || [];
                    const sel = document.getElementById("agendamentoSelect");
                    sel.innerHTML = '<option value="">Escolha uma oficina...</option>';
                    
                    // Mostra apenas oficinas com status "Realizada" para registrar gastos
                    agendamentosGlobais.filter(a => a.status === "Realizada").forEach(a => {
                        sel.innerHTML += `<option value="${a.id}">${a.data} - ${a.oficina} (${a.inst})</option>`;
                    });

                    document.getElementById("status").style.display = "none";
                    document.getElementById("formGastos").style.display = "block";
                })
                .catch(err => alert("Erro ao carregar dados: " + err));
        };

        document.getElementById("formGastos").onsubmit = (e) => {
            e.preventDefault();
            const btn = document.getElementById("btnEnviar");
            const agId = document.getElementById("agendamentoSelect").value;
            const ag = agendamentosGlobais.find(a => a.id == agId);

            btn.innerText = "A processar...";
            btn.disabled = true;

            const payload = {
                acao: "salvarGasto", // Roteador do Código.gs
                idAgendamento: agId,
                regional: ag.regional,
                oficina: ag.oficina,
                dataOficina: ag.data,
                dataInicialGasto: document.getElementById("dataInicial").value,
                dataFinalGasto: document.getElementById("dataFinal").value,
                valorTotalRealizado: document.getElementById("valorTotal").value
            };

            fetch(URL_GAS, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === "sucesso") {
                    alert("Gasto registrado com sucesso!");
                    location.reload();
                } else {
                    alert("Erro: " + data.msg);
                    btn.disabled = false;
                }
            })
            .catch(err => {
                alert("Falha de conexão: " + err);
                btn.disabled = false;
            });
        };
    </script>
</body>
</html>
